name: Build Multica iOS IPA (TrollStore)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'multica source ref'
        required: false
        default: 'main'
      api_url:
        description: 'self-hosted API base URL'
        required: false
        default: 'http://192.168.2.200:8080'
      web_url:
        description: 'self-hosted web URL'
        required: false
        default: 'http://192.168.2.200:3000'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Multica source
        uses: actions/checkout@v4
        with:
          repository: multica-ai/multica
          ref: ${{ github.event.inputs.ref || 'main' }}
          path: multica
          fetch-depth: 1

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcode-select -p
          node --version || true
          ruby --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - name: Install JS deps
        working-directory: multica
        run: pnpm install --frozen-lockfile

      - name: Point app at self-hosted backend
        env:
          API_URL: ${{ github.event.inputs.api_url || 'http://192.168.2.200:8080' }}
          WEB_URL: ${{ github.event.inputs.web_url || 'http://192.168.2.200:3000' }}
        run: |
          printf 'EXPO_PUBLIC_API_URL=%s\nEXPO_PUBLIC_WEB_URL=%s\n' "$API_URL" "$WEB_URL" > multica/apps/mobile/.env.production
          cat multica/apps/mobile/.env.production

      - name: Expo prebuild (iOS, production)
        working-directory: multica/apps/mobile
        env:
          APP_ENV: production
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'http://192.168.2.200:8080' }}
          EXPO_PUBLIC_WEB_URL: ${{ github.event.inputs.web_url || 'http://192.168.2.200:3000' }}
          EXPO_BUNDLE_IDENTIFIER_PROD: com.ja.multica.ipa
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
        run: |
          pnpm exec expo prebuild -p ios --no-install
          echo '--- generated ios/ ---'
          ls -la ios/ | head -40

      - name: CocoaPods install
        working-directory: multica/apps/mobile/ios
        run: pod install

      - name: Detect xcode target and scheme
        working-directory: multica/apps/mobile/ios
        run: |
          WS=$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)
          PROJ=$(find . -maxdepth 1 -name '*.xcodeproj' | head -1)
          if [ -n "$WS" ]; then
            echo "XCODE_ARGS=-workspace $WS" >> "$GITHUB_ENV"
            xcodebuild -list -workspace "$WS" -json > /tmp/list.json
          else
            echo "XCODE_ARGS=-project $PROJ" >> "$GITHUB_ENV"
            xcodebuild -list -project "$PROJ" -json > /tmp/list.json
          fi
          cat /tmp/list.json
          SCHEME=$(python3 -c 'import json,os,re;d=json.load(open("/tmp/list.json"));w=d.get("workspace") or d.get("project") or {};s=w.get("schemes") or [];b=next((p[:-10] for p in os.listdir(".") if p.endswith(".xcodeproj")),"");c=[x for x in s if x==b] or [x for x in s if "Multica" in x] or [x for x in s if not re.match(r"(?i)(pods|boost|react|flipper|yoga|fmt|glog|double|socket|hermes|RCT)",x)] or s;print(c[0] if c else "")')
          test -n "$SCHEME" || { echo 'NO SCHEME'; exit 1; }
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "scheme=$SCHEME"

      - name: Archive (unsigned, Release)
        working-directory: multica/apps/mobile/ios
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'http://192.168.2.200:8080' }}
          EXPO_PUBLIC_WEB_URL: ${{ github.event.inputs.web_url || 'http://192.168.2.200:3000' }}
        run: |
          set -o pipefail
          xcodebuild $XCODE_ARGS -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log"
          echo '--- archive products ---'
          ls -la "$RUNNER_TEMP/App.xcarchive/Products/" || true
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications" || { echo 'NO APPLICATIONS DIR'; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Patch finished app, ad-hoc sign and pack IPA
        env:
          API_URL: ${{ github.event.inputs.api_url || 'http://192.168.2.200:8080' }}
          WEB_URL: ${{ github.event.inputs.web_url || 'http://192.168.2.200:3000' }}
        run: |
          APP=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo 'NO APP IN ARCHIVE'; exit 1; }
          python3 -c 'import sys,plistlib,os,json;app=sys.argv[1];cfg=json.loads(sys.argv[2]);jb=os.path.join(app,"main.jsbundle");b=open(jb,"rb").read();n1=b.count(b"https://api.multica.ai");n2=b.count(b"https://multica.ai");b=b.replace(b"https://api.multica.ai",cfg["api"].encode()).replace(b"https://multica.ai",cfg["web"].encode());open(jb,"wb").write(b);print("bundle replaced api=%d web=%d"%(n1,n2));p=os.path.join(app,"Info.plist");d=plistlib.load(open(p,"rb"));d.setdefault("NSAppTransportSecurity",{})["NSAllowsArbitraryLoads"]=True;plistlib.dump(d,open(p,"wb"));print("ATS now:",d["NSAppTransportSecurity"])' "$APP" "{\"api\":\"$API_URL\",\"web\":\"$WEB_URL\"}"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0"><dict>' '<key>get-task-allow</key><true/>' '</dict></plist>' > "$RUNNER_TEMP/ent.plist"
          codesign --force --deep --sign - --entitlements "$RUNNER_TEMP/ent.plist" "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$RUNNER_TEMP/App.ipa" Payload)
          ls -lh "$RUNNER_TEMP/App.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: multica-ipa
          path: ${{ runner.temp }}/App.ipa
          if-no-files-found: error
